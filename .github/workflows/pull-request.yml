---
name: Pull Request
on:
  pull_request:
    types:
      - opened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Enable corepack
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install Dependencies
        run: pnpm install
      - name: Build
        run: pnpm build
      - name: ESLINT
        run: pnpm lint
      - name: Vitest
        run: pnpm run -C packages/sdk test

  changesets:
    name: Changeset quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      # Pending changesets only — released ones are consumed and deleted, and the check
      # needs no install, so this stays fast enough to be a required check.
      - name: Lint pending changesets
        run: node scripts/lint-changesets.mjs

  pr-title:
    name: PR title format
    # Squash merges land on main with the PR title, so it must follow the
    # commit-message standard too. Bot PRs (dependabot, changesets) are exempt.
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-message.mjs --message "$PR_TITLE"
